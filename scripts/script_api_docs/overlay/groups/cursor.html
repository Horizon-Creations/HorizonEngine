          <p>
            One row, and no <code>horizon.cursor.*</code> group: from a script use
            the flat <a href="#flat-showCursor"><code>horizon.showCursor()</code></a>
            and <code>horizon.hideCursor()</code>. Hiding the cursor also captures
            the mouse for camera control, showing it releases the mouse. In the
            editor this applies to play mode only.
          </p>
