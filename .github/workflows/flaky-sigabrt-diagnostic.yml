# TEMPORARY diagnostic workflow — investigating the sporadic SIGABRT in
# tests/test_python_scripting.cpp on the Linux runner. The failing run aborted with
# glibc's "malloc(): unaligned tcache chunk detected", i.e. allocator-metadata
# corruption, NOT a Python GC/finalizer-ordering problem. glibc reports that at the
# next malloc after the damage, so the reported test case is where the corruption is
# DETECTED, not necessarily where it is CAUSED.
#
# Three jobs, cheapest signal first:
#   stress-contended — real Release build, 4 concurrent suites x 15 rounds
#   asan             — ASan+UBSan, 2 concurrent x 8 rounds (pinpoints the write)
#   valgrind         — memcheck (catches the same class inside UNinstrumented libpython/SDL)
#
# Round 1 results: sequential Release x40 (half with MALLOC_PERTURB_) = 0 failures, so
# that job is dropped — the flake is rarer than 1-in-40 and needs contention, not more
# idle repetitions.
#
# DELETE THIS FILE once the root cause is fixed.
name: Flaky SIGABRT Diagnostic

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ── 1b. Same, but under contention ──────────────────────────────────────────
  # 40 sequential runs on an idle runner did NOT reproduce. The engine's JobSystem
  # pool sizes itself to hardware_concurrency, so on an idle 4-core runner a
  # background job starts almost immediately — which is exactly the timing that hides
  # a late-worker/teardown race. Running 4 suites at once oversubscribes the box, so
  # queued jobs actually wait, and it quadruples the samples per round.
  # stdbuf -oL keeps doctest's stdout line-buffered: on SIGABRT the buffer is
  # otherwise lost, and with it the name of the test that was running.
  stress-contended:
    name: Stress (4 concurrent x 15 rounds)
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            liblz4-dev libzstd-dev python3-dev
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHE_PREFER_MBEDTLS=ON
      - name: Build tests
        run: cmake --build build --target he_tests -j 4
      - name: Run 4 concurrent suites x 15 rounds
        env:
          MALLOC_PERTURB_: "165"
        run: |
          set +e
          fails=0
          for round in $(seq 1 15); do
            declare -A pids
            for c in 1 2 3 4; do
              stdbuf -oL -eL ./build/tests/he_tests --duration=true > "r${round}_${c}.log" 2>&1 &
              pids[$c]=$!
            done
            for c in 1 2 3 4; do
              wait "${pids[$c]}"; rc=$?
              if [ $rc -ne 0 ]; then
                fails=$((fails+1))
                echo "::group::round $round copy $c FAILED rc=$rc"
                tail -40 "r${round}_${c}.log"
                echo "::endgroup::"
              fi
            done
            rm -f r${round}_*.log
            echo "round $round done (running total of failures: $fails)"
          done
          echo "=== $fails / 60 concurrent runs failed ==="
          [ $fails -eq 0 ]

  # ── 2. Where is the bad write? ──────────────────────────────────────────────
  # detect_leaks=0: the embedded interpreter is deliberately never Py_Finalize'd, so
  # LeakSanitizer would bury the real finding under thousands of intentional leaks.
  # detect_odr_violation=0: the hcgen parity fixtures are compiled BOTH into he_tests
  # and into libtest_hcgen.so by design, which ASan flags on sight.
  # UBSan is non-halting so a benign UB report cannot mask an ASan memory finding.
  asan:
    name: ASan + UBSan
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            liblz4-dev libzstd-dev python3-dev
      # -fno-sanitize=vptr: UBSan's vptr check emits typeinfo references for every
      # polymorphic type, but Jolt and Recast are compiled without RTTI — leaving
      # "undefined reference to typeinfo for JPH::Shape" & co. at link time. The check
      # is unrelated to the heap corruption we are chasing, so it goes.
      - name: Configure (sanitized)
        run: |
          cmake -B build-asan -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DHE_PREFER_MBEDTLS=ON \
            -DHE_ENABLE_ASTC=OFF \
            -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer -g" \
            -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr -fno-omit-frame-pointer -g" \
            -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr" \
            -DCMAKE_SHARED_LINKER_FLAGS="-fsanitize=address,undefined -fno-sanitize=vptr"
      - name: Build tests
        run: cmake --build build-asan --target he_tests -j 4
      # 2 concurrent copies x 8 rounds rather than a few sequential runs: the flake did
      # not show in 40 sequential Release runs, so single-shot ASan would almost
      # certainly come back green and prove nothing. Oversubscribing the runner is what
      # makes a queued background job actually sit in the queue.
      - name: Run suite 16x under ASan (2 concurrent x 8 rounds)
        env:
          ASAN_OPTIONS: detect_leaks=0:detect_odr_violation=0:abort_on_error=1:print_stacktrace=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=0
          # Route CPython's allocations through raw malloc so ASan can see
          # use-after-free / overflow on Python objects too (pymalloc's arenas are
          # opaque to ASan and would hide exactly this class of bug).
          PYTHONMALLOC: malloc
        run: |
          set +e
          fails=0
          for round in $(seq 1 8); do
            declare -A pids
            for c in 1 2; do
              stdbuf -oL -eL ./build-asan/tests/he_tests > "a${round}_${c}.log" 2>&1 &
              pids[$c]=$!
            done
            for c in 1 2; do
              wait "${pids[$c]}"; rc=$?
              if [ $rc -ne 0 ]; then
                fails=$((fails+1))
                echo "::group::ASan round $round copy $c FAILED rc=$rc"
                tail -150 "a${round}_${c}.log"
                echo "::endgroup::"
              fi
            done
            rm -f a${round}_*.log
            echo "ASan round $round done (running total of failures: $fails)"
          done
          echo "=== $fails / 16 ASan runs failed ==="
          [ $fails -eq 0 ]

  # ── 3. The blind spot ASan cannot cover ─────────────────────────────────────
  # ASan only instruments code we compile. A bad write performed inside libpython,
  # SDL or glibc's own pthread code is invisible to it (that is exactly how a
  # confirmed use-after-free in ContentManager's async path slipped past ASan
  # locally — the offending access happened inside pthread_mutex_lock).
  # Valgrind checks every instruction regardless of who compiled it.
  valgrind:
    name: Valgrind memcheck
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: seanmiddleditch/gha-setup-ninja@v5
      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y valgrind \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            liblz4-dev libzstd-dev python3-dev
      # HE_ENABLE_ASTC=OFF: astcenc is fetched with ASTCENC_ISA_NATIVE=ON, i.e. built
      # with -march=native. On the runner that emits instructions Valgrind's VEX cannot
      # emulate, and the first ASTC test dies with SIGILL inside astcenc_config_init —
      # which aborted the run at test 423/960, long before the region of interest
      # (Python tests are ~689). Dropping the encoder costs one unrelated test case and
      # buys coverage of the whole suite.
      - name: Configure
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DHE_PREFER_MBEDTLS=ON -DHE_ENABLE_ASTC=OFF
      - name: Build tests
        run: cmake --build build --target he_tests -j 4
      - name: memcheck
        env:
          # Without this, pymalloc's deliberate reads of uninitialised arena bytes
          # drown the log in false positives on a stock (non --with-valgrind) CPython.
          PYTHONMALLOC: malloc
        run: |
          set +e
          valgrind --tool=memcheck --error-limit=no --num-callers=30 \
                   --keep-debuginfo=yes --track-origins=yes \
                   --errors-for-leak-kinds=none --leak-check=no \
                   ./build/tests/he_tests 2>&1 | tee vg.log | tail -40
          echo "=== memcheck error summary ==="
          grep -E "Invalid (write|read)|ERROR SUMMARY|Mismatched|blocks are|jump" vg.log | tail -60
          # A run that dies early (SIGILL/SIGABRT) reports "0 errors" for the part it
          # never reached — so assert we actually got to the end before trusting that.
          echo "=== coverage check ==="
          grep -E "\[doctest\] test cases:" vg.log || true
          if grep -qE "test case CRASHED|skipped" vg.log && ! grep -qE "0 skipped" vg.log; then
            echo "WARNING: memcheck did not cover the whole suite — result is inconclusive"
          fi
