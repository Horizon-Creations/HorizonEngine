name: CI

on:
  # A release's topics are merged into its own branch (release/<version>, see
  # the Hive's publishing), and exactly that branch is built and published.
  # So it gets the same as main: a run on every push — only a push stages the
  # two app runtimes the editor package ships — and on every PR into it.
  push:
    branches: [ main, 'release/**' ]
  # A pull request that only touches docs needs no build. Not for pushes: a
  # release branch's head commit must always get its run, publishing looks for
  # a green run of exactly that commit.
  pull_request:
    branches: [ main, 'release/**' ]
    paths-ignore: [ 'docs/**', '**/*.md' ]
  # A feature branch can ask for the full matrix before it is merged
  # (`gh workflow run CI --ref <branch>`), the way a Windows-only link error
  # is otherwise only ever seen on main.
  workflow_dispatch:

# One run per branch: a newer push (or a bee's dispatch on a branch whose pull
# request already runs) cancels the one still going. Four pushes to
# release/0.7.0 within a minute were four full matrices queueing for the same
# runners. Grouped by branch name, not ref, so a pull request's run and a
# dispatch on its branch are the same group. Publishing only needs the newest
# head's run; the Hive's topic watch treats a newer run as replacing the old.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            runner: '"macos-latest"'
            cache: ccache
          # Windows builds on NN-WS03 when the Hive reports it free: the Hive
          # (ci.py, route_windows) sets the repository variable WINDOWS_RUNNER
          # to nn-ws03 while that device's self-hosted runner is online and the
          # PC isn't at its limit (bees working there are fine — a Ryzen 9
          # 9950X), and back otherwise. There it builds
          # incrementally in a build tree that stays — minutes instead of the
          # hosted runner's ~50. Only for topic branches (pull requests and
          # dispatches): main and the release branches make the download
          # packages and stay on GitHub's clean machines. Never for a pull
          # request from a fork: this repository is public, and a fork's code
          # must not run on a PC at home.
          - name: Windows
            runner: >-
              ${{ (vars.WINDOWS_RUNNER == 'nn-ws03'
              && github.event_name != 'push'
              && github.ref_name != 'main'
              && !startsWith(github.ref_name, 'release/')
              && (github.event_name != 'pull_request'
              || github.event.pull_request.head.repo.full_name == github.repository))
              && '["self-hosted","nn-ws03"]' || '"windows-latest"' }}
            cache: sccache
          - name: Linux
            runner: '"ubuntu-latest"'
            cache: ccache

    name: ${{ matrix.name }}
    runs-on: ${{ fromJSON(matrix.runner) }}

    steps:
      # On NN-WS03 the build tree stays between runs — that is the point.
      # checkout's clean would wipe it (git clean -ffdx); the tidy step below
      # cleans everything else.
      - uses: actions/checkout@v4
        with:
          clean: ${{ runner.environment != 'self-hosted' }}

      - name: Tidy the workspace, keep the build tree (NN-WS03)
        if: runner.environment == 'self-hosted'
        run: git clean -ffdx -e build/ -e package/

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows: the Vulkan SDK, so RendererVulkan is compiled by a real compiler.
      # Until 20.09.2026 no CI job had the SDK, src/HE_Rendering/CMakeLists.txt
      # answered with "Vulkan backend disabled (SDK not found)" on every runner,
      # and the 12k lines of the Vulkan backend were only ever checked with
      # clang -fsyntax-only against the MoltenVK headers on a developer Mac. A
      # branch could be green here with a VulkanRenderer.cpp that does not compile.
      #
      # Windows rather than Linux because that is the platform the backend is for:
      # the editor's ImGui Vulkan bridge is compiled from the same switch, and the
      # package step below already lists "Vulkan Shaders" among what it ships.
      #
      # Pinned to the version the shader cross-compiler is fetched at (the
      # vulkan-sdk-1.4.313.0 tags of glslang and SPIRV-Cross in the root CMakeLists),
      # and checked against LunarG's published SHA256 (sdk.lunarg.com/sdk/files.json)
      # so a tampered or truncated download fails here and not as a linker mystery.
      # The installer is a GUI-subsystem exe: called directly PowerShell returns at
      # once and configure would run against a half-written SDK, hence
      # Start-Process -Wait. It writes VULKAN_SDK into the system environment, which
      # this running job never sees — so the variable is exported by hand, and only
      # after the headers, the import library and glslc are confirmed to be there.
      # No cache: 254 MB from LunarG's CDN restores about as fast as actions/cache.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows' && runner.environment != 'self-hosted'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.313.0'
          $sha256  = 'b643ca8ab4aea5c47b9c4e021a0b33b3a13871bf1d8131e162a9e48c257c4694'
          $url     = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          $exe     = "$env:RUNNER_TEMP\vulkansdk-$version.exe"
          $root    = "C:\VulkanSDK\$version"

          curl.exe --fail --location --retry 5 --retry-delay 10 --silent --show-error --output $exe $url
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed (curl exit $LASTEXITCODE)" }
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($actual -ne $sha256) { throw "Vulkan SDK installer SHA256 mismatch: expected $sha256, got $actual" }

          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            '--root', $root, '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }

          foreach ($f in @('Include\vulkan\vulkan.h', 'Lib\vulkan-1.lib', 'Bin\glslc.exe', 'Bin\glslangValidator.exe')) {
            if (-not (Test-Path "$root\$f")) { throw "Vulkan SDK install incomplete: $root\$f missing" }
          }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH
          Write-Host "Vulkan SDK $version installed at $root"

      # NN-WS03 has the SDK installed (the installer needs admin rights, the
      # runner doesn't have them); its installer set VULKAN_SDK system-wide.
      - name: Vulkan SDK present (NN-WS03)
        if: runner.os == 'Windows' && runner.environment == 'self-hosted'
        shell: pwsh
        run: |
          if (-not $env:VULKAN_SDK -or -not (Test-Path "$env:VULKAN_SDK\Include\vulkan\vulkan.h")) {
            throw "VULKAN_SDK is not set or incomplete on this runner — install the Vulkan SDK and restart the runner service"
          }
          Write-Host "Vulkan SDK at $env:VULKAN_SDK"

      # Linux: SDL3 is compiled from source (FetchContent) and needs the X11/Wayland,
      # OpenGL/EGL, audio and udev/dbus dev headers; the engine also links Python and
      # uses lz4/zstd. Install the dev packages before configuring. (Vulkan is optional
      # and left out — the Linux build uses the OpenGL backend; the Windows job above
      # is where RendererVulkan gets compiled, the vulkan-lavapipe job below where
      # it runs.)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            liblz4-dev libzstd-dev python3-dev \
            libcurl4-openssl-dev

      # The build was the whole run: Windows 46 of ~54 minutes, Linux 28,
      # macOS 21 — every run compiled everything from scratch on four cores.
      # ccache (sccache for MSVC, which ccache doesn't cover as well) keeps the
      # objects: one blob per platform in the Actions cache, restored here,
      # saved at the end. Only runs of pushes and dispatches write it; a pull
      # request restores from its base branch and main but writes nothing —
      # that keeps the repository's 10 GB from churning on one blob per PR, and
      # on a public repository only trusted refs write what others restore.
      # After the Linux packages: the action installs ccache with apt and
      # relies on the package index that step refreshed. Log.cpp uses
      # __DATE__/__TIME__ and is (rightly) never cached.
      #
      # Not on NN-WS03: its build tree stays, Ninja recompiles only what
      # changed — and the action needs `sh`, which a Windows PC needn't have.
      - name: Compiler cache
        if: runner.environment != 'self-hosted'
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.name }}
          variant: ${{ matrix.cache }}
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}

      # Every compiler call through it. As environment, not on the configure
      # lines: build_runtimes.py configures two more trees for the app
      # runtimes and inherits it — CMake takes these variables as the default
      # for CMAKE_<LANG>_COMPILER_LAUNCHER (checked: OBJCXX too, so
      # MetalRenderer.mm and the other .mm files are cached as well).
      - name: Compile through the cache
        if: runner.environment != 'self-hosted'
        shell: bash
        run: |
          for lang in C CXX OBJC OBJCXX; do
            echo "CMAKE_${lang}_COMPILER_LAUNCHER=${{ matrix.cache }}" >> "$GITHUB_ENV"
          done

      # FetchContent checkouts (SDL3, assimp, glslang, nlohmann_json, …) so CI
      # does not re-clone them on every run. They were ~850 MB per entry and a
      # new entry for every change to CMakeLists.txt on every branch, PRs
      # included: 12 GB, over the repository's 10 GB, before any compiler
      # cache. Now: restored with a fallback to the previous entry (FetchContent
      # updates what changed), and written only by pushes and dispatches, right
      # after configure — sources only, the compiled dependencies come from the
      # compiler cache. (NN-WS03 keeps build/_deps itself.)
      - name: Restore FetchContent dependencies
        id: deps
        if: runner.environment != 'self-hosted'
        uses: actions/cache/restore@v4
        with:
          path: build/_deps
          key: deps2-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps2-${{ runner.os }}-

      # HE_PORTABLE_BUILD=ON on every job: these builds are uploaded as artifacts and
      # published as website releases, so nothing may be compiled for the runner's CPU
      # (-march=native in astcenc → SIGILL on an older user CPU during the texture cook).
      #
      # The HE_ENGINE_CONTENT_* environment variables carry the EngineContent SFTP
      # endpoint into the build (src/HE_ContentSync/CMakeLists.txt reads them). They
      # are repository secrets because this repository is public — a credential in a
      # tracked file stays greppable in every clone and fork forever. Passing them as
      # environment rather than -D keeps them out of the configure command line and
      # out of CMakeCache.txt, and spares any quoting question about the password.
      # Unset secrets are simply empty: the build then reports "not configured" and
      # the Editor works as it did before the remote library existed.
      # macOS uses static mbedTLS for the same reason Linux and Windows do, and it
      # was the only one of the three that did not: libcrypto is a LOAD-TIME edge
      # of libHorizonCore, so a shipped build carried 4,8 MB of Homebrew OpenSSL
      # that no export could leave out. Statically linked mbedcrypto costs
      # HorizonCore 0,3 MB and removes the dylib entirely — net −4,5 MB in every
      # packaged game (docs/he-apps-plan.md A3a). It also removes a bundled
      # third-party dylib from the deployment-target stamping problem.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        env:
          HE_ENGINE_CONTENT_HOST: ${{ secrets.ENGINE_CONTENT_HOST }}
          HE_ENGINE_CONTENT_USER: ${{ secrets.ENGINE_CONTENT_USER }}
          HE_ENGINE_CONTENT_PASSWORD: ${{ secrets.ENGINE_CONTENT_PASSWORD }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHE_PORTABLE_BUILD=ON -DHE_PREFER_MBEDTLS=ON

      # Linux: build a self-contained editor package like Windows — bundle cmake so a
      # user only needs a C++ compiler, use static mbedTLS so there's no external
      # libcrypto/OpenSSL dependency, and deploy into the workspace for packaging.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          HE_ENGINE_CONTENT_HOST: ${{ secrets.ENGINE_CONTENT_HOST }}
          HE_ENGINE_CONTENT_USER: ${{ secrets.ENGINE_CONTENT_USER }}
          HE_ENGINE_CONTENT_PASSWORD: ${{ secrets.ENGINE_CONTENT_PASSWORD }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHE_PORTABLE_BUILD=ON -DHE_BUNDLE_CMAKE=ON -DHE_PREFER_MBEDTLS=ON "-DDEPLOY_DIR=${{ github.workspace }}/package"

      # Windows: build a self-contained editor package — bundle cmake, deploy into the
      # workspace for the packaging step, and use static mbedTLS so there's no external
      # OpenSSL DLL dependency (a clean PC then needs only the C++ toolchain at build time).
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        env:
          HE_ENGINE_CONTENT_HOST: ${{ secrets.ENGINE_CONTENT_HOST }}
          HE_ENGINE_CONTENT_USER: ${{ secrets.ENGINE_CONTENT_USER }}
          HE_ENGINE_CONTENT_PASSWORD: ${{ secrets.ENGINE_CONTENT_PASSWORD }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHE_PORTABLE_BUILD=ON -DHE_BUNDLE_CMAKE=ON -DHE_PREFER_MBEDTLS=ON "-DDEPLOY_DIR=${{ github.workspace }}/package"

      # Configure has fetched everything; nothing is compiled yet.
      - name: Save FetchContent dependencies
        if: >-
          runner.environment != 'self-hosted' && github.event_name != 'pull_request'
          && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/_deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # The SDK step above can succeed and the backend still silently fall out of
      # the build: find_package(Vulkan) not seeing the variable, a renamed SDK
      # layout, a future refactor of the detection. CMake only reports that as a
      # STATUS line nobody reads. HE_VULKAN_ENABLED is CACHE INTERNAL, so the
      # resolved answer sits in CMakeCache.txt — fail the job right here if it is
      # not TRUE, because a Windows build without RendererVulkan is exactly the
      # unchecked state this job exists to end. PowerShell, not bash: NN-WS03
      # needn't have a bash on its PATH. (Select-String reads lines without
      # their CRLF, so TRUE$ holds.)
      - name: Assert the Vulkan backend is enabled (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (Select-String -Path build/CMakeCache.txt -Pattern '^HE_VULKAN_ENABLED:INTERNAL=TRUE$' -Quiet) {
            Write-Host "HE_VULKAN_ENABLED=TRUE — RendererVulkan is part of this build"
          } else {
            Write-Host "::error::HE_VULKAN_ENABLED is not TRUE in build/CMakeCache.txt — the Vulkan SDK was installed but CMake did not pick it up"
            Select-String -Path build/CMakeCache.txt -Pattern 'HE_VULKAN_ENABLED|Vulkan_'
            exit 1
          }

      # Four jobs on GitHub's four cores; on NN-WS03 Ninja's default (all of
      # its 32 threads — it has room for that next to the bees).
      - name: Build
        run: cmake --build build ${{ runner.environment == 'self-hosted' && '--parallel' || '-j 4' }}

      # -j because the suite waits far more than it computes: real git
      # subprocesses, child-process kills, socket handshakes, polling sleeps.
      # Serially that was 442 s here while the test bodies sum to ~31 s.
      #
      # HE_NET_LOOPBACK_ONLY=0: tests/main.cpp otherwise binds every listener to
      # loopback, which spares a developer's desktop the Windows Firewall dialog
      # but skips the dual-stack and LAN-reachability tests. A hosted runner
      # asks nobody — NN-WS03 is a desktop, there it stays loopback.
      - name: Run tests
        env:
          HE_NET_LOOPBACK_ONLY: ${{ runner.environment == 'self-hosted' && '1' || '0' }}
        run: ctest --test-dir build --output-on-failure -j4

      # The Metal backend compiles its MSL strings at RUNTIME (newLibraryWithSource)
      # and answers a failure by disabling the feature, while the build above only
      # compiles MetalRenderer.mm as Objective-C++ — and the build's shader check
      # reports "All 0 embedded shaders compile" here, since fxc and glslangValidator
      # are absent. This step is the Metal counterpart: every R"MSL( string through
      # the offline compiler, after a broken snippet has to be rejected. Xcode 26
      # ships the compiler as a separate component, fetched if the image lacks it.
      # Not gated on the tests: a red test must not hide whether the MSL compiles.
      - name: Compile-check the runtime MSL strings (macOS)
        if: runner.os == 'macOS' && !cancelled()
        run: |
          if ! xcrun -sdk macosx metal --version; then
            xcodebuild -downloadComponent MetalToolchain
            xcrun -sdk macosx metal --version
          fi
          python3 scripts/validate_embedded_shaders.py --msl-only --require-msl -v

      # Graph materials have no MSL string to extract: theirs exists only once
      # MaterialShaderLibrary cross-compiles the graph, so the step above never
      # sees it, and no he_tests case can reach a Metal compiler (the toolchain
      # arrives after ctest). he_tests dumps every variant the renderers build
      # for the engine water material (Thema 152) and the script hands them to
      # the same compiler, negative control first; --require-msl turns a missing
      # toolchain into a failure instead of a skip.
      - name: Compile-check the engine water material's MSL (macOS)
        if: runner.os == 'macOS' && !cancelled()
        run: python3 scripts/water_shader_offline_check.py --require-msl --he-tests build/tests/he_tests -v

      # ── The two app runtimes ────────────────────────────────────────────────────
      # docs/app-runtimes-release-pipeline-plan.md. The build above deployed ONE
      # runtime, Game, next to the editor. An exported HorizonApp wants a leaner one
      # (app-advanced: the platform's forward renderer alone; app-basic:
      # RendererSoftware alone, both without the shader cross-compiler), and until
      # now nothing ever built them outside the size-measuring workflow — so
      # findRuntimeBundle() fell back to Game and every app shipped the full engine.
      #
      # A flavour is a whole separate build tree (HE_ENABLE_SHADERC decides whether
      # glslang is fetched at all, and the backend set is baked into one shared
      # HorizonRendering), so this cannot be another output of the build above. It is
      # roughly five minutes per flavour on macOS and Linux, nine on Windows.
      #
      # push-only. A pull request has no use for a complete editor package, and
      # doubling its Windows job to keep one is the wrong trade.
      #
      # AFTER the tests on purpose: pulling the flavour builds before ctest would let
      # a link error in a runtime nobody runs hold up the statement about whether the
      # code is good. The two runtime_size ctest cases stay skipped because of that;
      # the threshold check below is what judges the sizes instead.
      #
      # --source-tree hands over the editor tree's FetchContent checkouts (the one
      # actions/cache restores as build/_deps), so the flavours reuse SDL, Jolt,
      # Recast and Lua instead of cloning each of them twice more.
      #
      # DEPLOY_DIR differs by platform: Windows and Linux configure the editor with
      # -DDEPLOY_DIR=<workspace>/package, macOS takes the default <source>/out/deploy
      # because package_macos.sh reads exactly that path. The flavours have to land in
      # the same root as Game either way.
      - name: Build the two app runtimes
        if: github.event_name == 'push'
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          if [ "$RUNNER_OS" = "macOS" ]; then
            DEPLOY="${{ github.workspace }}/out/deploy"
          else
            DEPLOY="${{ github.workspace }}/package"
          fi
          echo "DEPLOY_ROOT=$DEPLOY" >> "$GITHUB_ENV"
          "$PY" scripts/build_runtimes.py \
            --flavor app-advanced --flavor app-basic \
            --build-type Release \
            --jobs 4 \
            --deploy-dir "$DEPLOY" \
            --source-tree "${{ github.workspace }}/build" \
            --define HE_PORTABLE_BUILD=ON \
            --define HE_PREFER_MBEDTLS=ON

      # The size guard for main, moved here from runtime-flavors.yml — that workflow
      # is now for feature branches only, and main would otherwise lose the watch on
      # all three runtimes at once. Game is weighed too: the editor build deployed it.
      #
      # Exit code 2 is the script's "nothing I may judge" — a platform or flavour with
      # no measured threshold yet. That stays green, or the first run on a new platform
      # goes red for the honest state it exists to establish.
      - name: Check the runtimes against the size thresholds
        if: github.event_name == 'push'
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          rc=0
          for pair in "Game:game" "AppAdvanced:app-advanced" "AppBasic:app-basic"; do
            dir="${pair%%:*}"; flavor="${pair##*:}"
            echo "── $flavor ──────────────────────────────────────────────"
            set +e
            "$PY" scripts/runtime_size.py "$DEPLOY_ROOT/$dir" \
              --check --flavor="$flavor" --build-type=Release
            code=$?
            set -e
            if [ "$code" = "2" ]; then
              echo "(no measured threshold yet — skipped)"
            elif [ "$code" != "0" ]; then
              rc=1
            fi
          done
          exit $rc

      # Windows and Linux ship package/Editor as a whole, so the runtimes have to move
      # INTO it — the same place the editor's own POST_BUILD puts Editor/Game, and the
      # only place findRuntimeBundle() looks once the editor is unzipped somewhere else
      # entirely. macOS does the equivalent inside package_macos.sh, where the target is
      # HorizonEditor.app/Contents/Resources.
      #
      # The .log and .ini are dev-time run droppings the deploy can accumulate; Game
      # gets the same treatment in package_macos.sh.
      - name: Stage the app runtimes into the editor package
        if: github.event_name == 'push' && runner.os != 'macOS'
        shell: bash
        run: |
          for name in AppAdvanced AppBasic; do
            if [ -d "$DEPLOY_ROOT/$name" ]; then
              rm -rf "$DEPLOY_ROOT/Editor/$name"
              mv "$DEPLOY_ROOT/$name" "$DEPLOY_ROOT/Editor/$name"
              rm -f "$DEPLOY_ROOT/Editor/$name/HorizonEngine.log" \
                    "$DEPLOY_ROOT/Editor/$name/imgui.ini"
              echo "staged $name"
            else
              echo "::error::$DEPLOY_ROOT/$name missing — the flavour build did not deploy it"
              exit 1
            fi
          done

      # The editor POST_BUILD deployed a self-contained bundle into package/Editor:
      # HorizonEditor.exe + engine DLLs + SDL3 + EngineContent/Fonts/Images + Vulkan
      # Shaders + the bundled cmake + the CPython runtime (python3XY.dll/.zip/._pth),
      # plus the Game runtime and — on a push — the two app runtimes staged above.
      # Zip it and upload as a downloadable artifact (the "Artifacts" box on the run).
      #
      # Moved below the tests so all three platforms package in the same place in the
      # run. It used to sit before them, which meant Windows uploaded an editor even
      # when ctest was red; it now behaves like macOS and Linux always have.
      #
      # Not on NN-WS03: a topic branch's check needs no download package, its
      # package/ is an incremental deploy that keeps old files, and the zip
      # would go up through a home connection.
      - name: Package Windows editor
        if: runner.os == 'Windows' && runner.environment != 'self-hosted'
        shell: pwsh
        run: Compress-Archive -Path "package/Editor/*" -DestinationPath "HorizonEditor-windows-x64.zip" -Force

      - name: Upload Windows editor package
        if: runner.os == 'Windows' && runner.environment != 'self-hosted'
        uses: actions/upload-artifact@v4
        with:
          name: HorizonEditor-windows-x64
          path: HorizonEditor-windows-x64.zip
          if-no-files-found: error

      # ── macOS: build the self-contained .app + DMG installer ────────────────────
      # The `dmg` custom target runs scripts/package_macos.sh, which stages
      # out/deploy/Editor into HorizonEditor.app (engine dylibs BFS-bundled + rpaths
      # rewritten), ad-hoc code-signs it (no Developer ID / secrets — cert-free), and
      # produces out/HorizonEditor-<version>.dmg. Runs after the tests so a packaging
      # failure surfaces without masking the build+test result.
      - name: Package macOS editor (DMG)
        if: runner.os == 'macOS'
        run: cmake --build build --target dmg

      - name: Upload macOS editor package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: HorizonEditor-macos-arm64
          path: out/HorizonEditor-*.dmg
          if-no-files-found: error

      # ── Linux: tarball the self-contained editor bundle ─────────────────────────
      # The editor POST_BUILD deployed package/Editor: HorizonEditor + engine .so
      # (found next to it via the $ORIGIN rpath) + SDL3 + EngineContent/Fonts/Images +
      # bundled cmake + libpython + the Game runtime. tar (not zip) preserves the
      # executable bit on the binaries.
      - name: Package Linux editor
        if: runner.os == 'Linux'
        run: tar czf HorizonEditor-linux-x64.tar.gz -C package Editor

      - name: Upload Linux editor package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: HorizonEditor-linux-x64
          path: HorizonEditor-linux-x64.tar.gz
          if-no-files-found: error

  # Vulkan image tests on a software ICD (Thema 122, docs/ci-software-vulkan-icd-
  # analyse-2026-10-03.md). Mesa lavapipe draws on the CPU, so the VulkanRenderer
  # finally RUNS somewhere automatic — until now it was only compiled (Windows job)
  # and every Vulkan picture came from a manual run on one RTX machine.
  #
  # A job of its own, not a step in the Linux job: libvulkan-dev there would flip
  # HE_VULKAN_ENABLED through find_package(Vulkan) and the shipped Linux editor
  # package would suddenly carry RendererVulkan + Shaders/ — a product decision,
  # not a CI one. This job builds only HorizonEditor and runs in parallel; Windows
  # stays the long pole.
  #
  # ubuntu-24.04 pinned rather than -latest: the Mesa version decides the pictures,
  # and a runner-image bump should be a visible commit, not a silent change.
  vulkan-lavapipe:
    name: Linux · Vulkan (lavapipe)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    # The compiler cache as in the matrix above — a key of its own: this tree
    # has RendererVulkan on and other flags, its objects aren't the Linux job's.
    env:
      CMAKE_C_COMPILER_LAUNCHER: ccache
      CMAKE_CXX_COMPILER_LAUNCHER: ccache

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      # The Linux job's packages, plus: the lavapipe ICD (mesa-vulkan-drivers),
      # loader + headers for the build (libvulkan-dev), vulkaninfo, the Khronos
      # validation layer (the renderer turns it on by itself when it is installed,
      # so every image test is also a validation run), glslangValidator for the
      # scene SPIR-V, and Xvfb for the X11 fallback probe.
      - name: Install dependencies (+ lavapipe)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            liblz4-dev libzstd-dev python3-dev \
            libcurl4-openssl-dev \
            mesa-vulkan-drivers libvulkan-dev vulkan-tools vulkan-validationlayers \
            glslang-tools xvfb
          dpkg-query -W mesa-vulkan-drivers libvulkan1 vulkan-validationlayers glslang-tools

      # What the pictures were drawn with. A sudden change in the image numbers is
      # explained by this block or not at all. headless_surface is what the SDL
      # offscreen driver needs for a surface without a display; ray_query is the
      # GI hardware-RT path. A missing one is reported here and fails the image
      # test that depends on it, not the whole job.
      #
      # VK_DRIVER_FILES pins the loader to lavapipe alone (the package also ships
      # intel/radeon/nouveau/asahi/virtio ICDs): the renderer takes devs[0] without
      # choosing, and the device line in each test log proves the pick. The json is
      # looked up, not hard-coded — Mesa 25.2 on noble names it lvp_icd.json, older
      # Mesa lvp_icd.x86_64.json.
      - name: Software ICD witness
        run: |
          ls -l /usr/share/vulkan/icd.d/ /usr/share/vulkan/explicit_layer.d/ || true
          icd=$(ls /usr/share/vulkan/icd.d/lvp_icd*.json 2>/dev/null | head -1)
          test -n "$icd" || { echo "::error::no lavapipe ICD json in /usr/share/vulkan/icd.d"; exit 1; }
          echo "VK_DRIVER_FILES=$icd" >> "$GITHUB_ENV"
          export VK_DRIVER_FILES="$icd"
          cat "$icd"
          vulkaninfo --summary
          vulkaninfo > vkinfo.txt 2>&1 || true
          for ext in VK_EXT_headless_surface VK_KHR_ray_query VK_KHR_acceleration_structure; do
            if grep -q "$ext" vkinfo.txt; then echo "$ext: present"; else echo "::warning::lavapipe does not offer $ext"; fi
          done
          nproc

      - name: Compiler cache
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: Linux-vulkan
          max-size: 1G
          save: ${{ github.event_name != 'pull_request' }}

      # As in the matrix above: restore with fallback, save after configure.
      - name: Restore FetchContent dependencies
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: build/_deps
          key: deps2-${{ runner.os }}-vk-${{ hashFiles('CMakeLists.txt') }}
          restore-keys: deps2-${{ runner.os }}-vk-

      # Default DEPLOY_DIR (out/deploy): the editor and its Shaders/ land in
      # out/deploy/Editor, which is all the image tests need.
      #
      # This job builds HorizonEditor too (for the image tests), so it links
      # HorizonContentSync the same as the three matrix jobs above — the same
      # env: block for consistency. Without it the configure log read "not
      # configured" here while the matrix jobs showed the real endpoint, which
      # looked like a gap the first time someone compared the two logs (it
      # was: the three matrix jobs had this block, this job never did).
      # Harmless either way: he_vk_imagetests.py always sets HE_DUMP_PATH, so
      # every editor launch in this job takes the headless frame-dump path,
      # which returns before startSftpProbe() (and every other startup probe)
      # is ever called (EditorApplication.cpp, the "if (m_dumpPath.empty())"
      # guard around them) — the image tests never open a network connection
      # whether or not this block is here.
      - name: Configure
        env:
          HE_ENGINE_CONTENT_HOST: ${{ secrets.ENGINE_CONTENT_HOST }}
          HE_ENGINE_CONTENT_USER: ${{ secrets.ENGINE_CONTENT_USER }}
          HE_ENGINE_CONTENT_PASSWORD: ${{ secrets.ENGINE_CONTENT_PASSWORD }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHE_PORTABLE_BUILD=ON -DHE_PREFER_MBEDTLS=ON

      - name: Save FetchContent dependencies
        if: github.event_name != 'pull_request' && steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build/_deps
          key: ${{ steps.deps.outputs.cache-primary-key }}

      - name: Assert the Vulkan backend is enabled
        run: |
          if grep -qE '^HE_VULKAN_ENABLED:INTERNAL=TRUE$' build/CMakeCache.txt; then
            echo "HE_VULKAN_ENABLED=TRUE — RendererVulkan is part of this build"
          else
            echo "::error::HE_VULKAN_ENABLED is not TRUE — libvulkan-dev was installed but CMake did not pick it up"
            grep -n 'HE_VULKAN_ENABLED\|Vulkan_' build/CMakeCache.txt || true
            exit 1
          fi

      - name: Build editor
        id: build
        run: cmake --build build --target HorizonEditor -j 4

      - name: Deployed editor
        run: |
          ls -l out/deploy/Editor/HorizonEditor
          echo "SPIR-V shaders: $(ls out/deploy/Editor/Shaders/*.spv | wc -l)"

      # The X11 fallback (Mesa's X11 WSI under Xvfb), one A/B only. It answers
      # "does Vulkan presentation work at all here" independently of the SDL
      # offscreen path below, and is informational: the job's verdict is the
      # offscreen run.
      - name: Vulkan image probe (Xvfb)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          xvfb-run -a -s "-screen 0 1280x720x24" \
            python3 scripts/he_vk_imagetests.py \
              --editor out/deploy/Editor/HorizonEditor --out vk-shots/xvfb --cases nebula

      # SDL's offscreen video driver + VK_EXT_headless_surface: no display at all.
      # Runs even when the Xvfb probe failed, but only on a built editor.
      - name: Vulkan image tests (offscreen)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        timeout-minutes: 75
        env:
          SDL_VIDEO_DRIVER: offscreen
        run: |
          python3 scripts/he_vk_imagetests.py \
            --editor out/deploy/Editor/HorizonEditor --out vk-shots/offscreen

      - name: Upload Vulkan image-test shots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-lavapipe-shots
          path: |
            vk-shots/
            vkinfo.txt
          if-no-files-found: warn
