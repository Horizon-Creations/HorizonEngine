name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # A feature branch can ask for the full matrix before it is merged
  # (`gh workflow run CI --ref <branch>`), the way a Windows-only link error
  # is otherwise only ever seen on main.
  workflow_dispatch:

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            name: macOS
          - os: windows-latest
            name: Windows
          - os: ubuntu-latest
            name: Linux

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        uses: seanmiddleditch/gha-setup-ninja@v5

      - name: Set up MSVC environment (Windows)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Windows: the Vulkan SDK, so RendererVulkan is compiled by a real compiler.
      # Until 20.09.2026 no CI job had the SDK, src/HE_Rendering/CMakeLists.txt
      # answered with "Vulkan backend disabled (SDK not found)" on every runner,
      # and the 12k lines of the Vulkan backend were only ever checked with
      # clang -fsyntax-only against the MoltenVK headers on a developer Mac. A
      # branch could be green here with a VulkanRenderer.cpp that does not compile.
      #
      # Windows rather than Linux because that is the platform the backend is for:
      # the editor's ImGui Vulkan bridge is compiled from the same switch, and the
      # package step below already lists "Vulkan Shaders" among what it ships.
      #
      # Pinned to the version the shader cross-compiler is fetched at (the
      # vulkan-sdk-1.4.313.0 tags of glslang and SPIRV-Cross in the root CMakeLists),
      # and checked against LunarG's published SHA256 (sdk.lunarg.com/sdk/files.json)
      # so a tampered or truncated download fails here and not as a linker mystery.
      # The installer is a GUI-subsystem exe: called directly PowerShell returns at
      # once and configure would run against a half-written SDK, hence
      # Start-Process -Wait. It writes VULKAN_SDK into the system environment, which
      # this running job never sees — so the variable is exported by hand, and only
      # after the headers, the import library and glslc are confirmed to be there.
      # No cache: 254 MB from LunarG's CDN restores about as fast as actions/cache.
      - name: Install Vulkan SDK (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = '1.4.313.0'
          $sha256  = 'b643ca8ab4aea5c47b9c4e021a0b33b3a13871bf1d8131e162a9e48c257c4694'
          $url     = "https://sdk.lunarg.com/sdk/download/$version/windows/vulkansdk-windows-X64-$version.exe"
          $exe     = "$env:RUNNER_TEMP\vulkansdk-$version.exe"
          $root    = "C:\VulkanSDK\$version"

          curl.exe --fail --location --retry 5 --retry-delay 10 --silent --show-error --output $exe $url
          if ($LASTEXITCODE -ne 0) { throw "Vulkan SDK download failed (curl exit $LASTEXITCODE)" }
          $actual = (Get-FileHash -Algorithm SHA256 $exe).Hash.ToLower()
          if ($actual -ne $sha256) { throw "Vulkan SDK installer SHA256 mismatch: expected $sha256, got $actual" }

          $p = Start-Process -FilePath $exe -Wait -PassThru -ArgumentList @(
            '--root', $root, '--accept-licenses', '--default-answer', '--confirm-command', 'install')
          if ($p.ExitCode -ne 0) { throw "Vulkan SDK installer exited with $($p.ExitCode)" }

          foreach ($f in @('Include\vulkan\vulkan.h', 'Lib\vulkan-1.lib', 'Bin\glslc.exe', 'Bin\glslangValidator.exe')) {
            if (-not (Test-Path "$root\$f")) { throw "Vulkan SDK install incomplete: $root\$f missing" }
          }
          "VULKAN_SDK=$root" >> $env:GITHUB_ENV
          "$root\Bin" >> $env:GITHUB_PATH
          Write-Host "Vulkan SDK $version installed at $root"

      # Linux: SDL3 is compiled from source (FetchContent) and needs the X11/Wayland,
      # OpenGL/EGL, audio and udev/dbus dev headers; the engine also links Python and
      # uses lz4/zstd. Install the dev packages before configuring. (Vulkan is optional
      # and left out — the Linux build uses the OpenGL backend; the Windows job above
      # is where RendererVulkan gets compiled.)
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libx11-dev libxext-dev libxrandr-dev libxcursor-dev libxi-dev \
            libxfixes-dev libxss-dev libwayland-dev wayland-protocols libdecor-0-dev \
            libxkbcommon-dev libegl1-mesa-dev libgl1-mesa-dev libglu1-mesa-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev libibus-1.0-dev \
            liblz4-dev libzstd-dev python3-dev \
            libcurl4-openssl-dev

      # FetchContent checkouts (SDL3, glm, nlohmann_json) are cached on the
      # configure hash so CI does not re-clone them on every run.
      - name: Cache FetchContent dependencies
        uses: actions/cache@v4
        with:
          path: build/_deps
          key: deps-${{ runner.os }}-${{ hashFiles('CMakeLists.txt') }}

      # HE_PORTABLE_BUILD=ON on every job: these builds are uploaded as artifacts and
      # published as website releases, so nothing may be compiled for the runner's CPU
      # (-march=native in astcenc → SIGILL on an older user CPU during the texture cook).
      #
      # The HE_ENGINE_CONTENT_* environment variables carry the EngineContent SFTP
      # endpoint into the build (src/HE_ContentSync/CMakeLists.txt reads them). They
      # are repository secrets because this repository is public — a credential in a
      # tracked file stays greppable in every clone and fork forever. Passing them as
      # environment rather than -D keeps them out of the configure command line and
      # out of CMakeCache.txt, and spares any quoting question about the password.
      # Unset secrets are simply empty: the build then reports "not configured" and
      # the Editor works as it did before the remote library existed.
      # macOS uses static mbedTLS for the same reason Linux and Windows do, and it
      # was the only one of the three that did not: libcrypto is a LOAD-TIME edge
      # of libHorizonCore, so a shipped build carried 4,8 MB of Homebrew OpenSSL
      # that no export could leave out. Statically linked mbedcrypto costs
      # HorizonCore 0,3 MB and removes the dylib entirely — net −4,5 MB in every
      # packaged game (docs/he-apps-plan.md A3a). It also removes a bundled
      # third-party dylib from the deployment-target stamping problem.
      - name: Configure (macOS)
        if: runner.os == 'macOS'
        env:
          HE_ENGINE_CONTENT_HOST: ${{ secrets.ENGINE_CONTENT_HOST }}
          HE_ENGINE_CONTENT_USER: ${{ secrets.ENGINE_CONTENT_USER }}
          HE_ENGINE_CONTENT_PASSWORD: ${{ secrets.ENGINE_CONTENT_PASSWORD }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHE_PORTABLE_BUILD=ON -DHE_PREFER_MBEDTLS=ON

      # Linux: build a self-contained editor package like Windows — bundle cmake so a
      # user only needs a C++ compiler, use static mbedTLS so there's no external
      # libcrypto/OpenSSL dependency, and deploy into the workspace for packaging.
      - name: Configure (Linux)
        if: runner.os == 'Linux'
        env:
          HE_ENGINE_CONTENT_HOST: ${{ secrets.ENGINE_CONTENT_HOST }}
          HE_ENGINE_CONTENT_USER: ${{ secrets.ENGINE_CONTENT_USER }}
          HE_ENGINE_CONTENT_PASSWORD: ${{ secrets.ENGINE_CONTENT_PASSWORD }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHE_PORTABLE_BUILD=ON -DHE_BUNDLE_CMAKE=ON -DHE_PREFER_MBEDTLS=ON "-DDEPLOY_DIR=${{ github.workspace }}/package"

      # Windows: build a self-contained editor package — bundle cmake, deploy into the
      # workspace for the packaging step, and use static mbedTLS so there's no external
      # OpenSSL DLL dependency (a clean PC then needs only the C++ toolchain at build time).
      - name: Configure (Windows)
        if: runner.os == 'Windows'
        env:
          HE_ENGINE_CONTENT_HOST: ${{ secrets.ENGINE_CONTENT_HOST }}
          HE_ENGINE_CONTENT_USER: ${{ secrets.ENGINE_CONTENT_USER }}
          HE_ENGINE_CONTENT_PASSWORD: ${{ secrets.ENGINE_CONTENT_PASSWORD }}
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DHE_PORTABLE_BUILD=ON -DHE_BUNDLE_CMAKE=ON -DHE_PREFER_MBEDTLS=ON "-DDEPLOY_DIR=${{ github.workspace }}/package"

      # The SDK step above can succeed and the backend still silently fall out of
      # the build: find_package(Vulkan) not seeing the variable, a renamed SDK
      # layout, a future refactor of the detection. CMake only reports that as a
      # STATUS line nobody reads. HE_VULKAN_ENABLED is CACHE INTERNAL, so the
      # resolved answer sits in CMakeCache.txt — fail the job right here if it is
      # not TRUE, because a Windows build without RendererVulkan is exactly the
      # unchecked state this job exists to end.
      - name: Assert the Vulkan backend is enabled (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # \r? because CMake on Windows writes the cache with CRLF line ends.
          if grep -qE $'^HE_VULKAN_ENABLED:INTERNAL=TRUE\r?$' build/CMakeCache.txt; then
            echo "HE_VULKAN_ENABLED=TRUE — RendererVulkan is part of this build"
          else
            echo "::error::HE_VULKAN_ENABLED is not TRUE in build/CMakeCache.txt — the Vulkan SDK was installed but CMake did not pick it up"
            grep -n 'HE_VULKAN_ENABLED\|Vulkan_' build/CMakeCache.txt || true
            exit 1
          fi

      - name: Build
        run: cmake --build build -j 4

      # -j because the suite waits far more than it computes: real git
      # subprocesses, child-process kills, socket handshakes, polling sleeps.
      # Serially that was 442 s here while the test bodies sum to ~31 s.
      - name: Run tests
        run: ctest --test-dir build --output-on-failure -j4

      # ── The two app runtimes ────────────────────────────────────────────────────
      # docs/app-runtimes-release-pipeline-plan.md. The build above deployed ONE
      # runtime, Game, next to the editor. An exported HorizonApp wants a leaner one
      # (app-advanced: the platform's forward renderer alone; app-basic:
      # RendererSoftware alone, both without the shader cross-compiler), and until
      # now nothing ever built them outside the size-measuring workflow — so
      # findRuntimeBundle() fell back to Game and every app shipped the full engine.
      #
      # A flavour is a whole separate build tree (HE_ENABLE_SHADERC decides whether
      # glslang is fetched at all, and the backend set is baked into one shared
      # HorizonRendering), so this cannot be another output of the build above. It is
      # roughly five minutes per flavour on macOS and Linux, nine on Windows.
      #
      # push-only. A pull request has no use for a complete editor package, and
      # doubling its Windows job to keep one is the wrong trade.
      #
      # AFTER the tests on purpose: pulling the flavour builds before ctest would let
      # a link error in a runtime nobody runs hold up the statement about whether the
      # code is good. The two runtime_size ctest cases stay skipped because of that;
      # the threshold check below is what judges the sizes instead.
      #
      # --source-tree hands over the editor tree's FetchContent checkouts (the one
      # actions/cache restores as build/_deps), so the flavours reuse SDL, Jolt,
      # Recast and Lua instead of cloning each of them twice more.
      #
      # DEPLOY_DIR differs by platform: Windows and Linux configure the editor with
      # -DDEPLOY_DIR=<workspace>/package, macOS takes the default <source>/out/deploy
      # because package_macos.sh reads exactly that path. The flavours have to land in
      # the same root as Game either way.
      - name: Build the two app runtimes
        if: github.event_name == 'push'
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          if [ "$RUNNER_OS" = "macOS" ]; then
            DEPLOY="${{ github.workspace }}/out/deploy"
          else
            DEPLOY="${{ github.workspace }}/package"
          fi
          echo "DEPLOY_ROOT=$DEPLOY" >> "$GITHUB_ENV"
          "$PY" scripts/build_runtimes.py \
            --flavor app-advanced --flavor app-basic \
            --build-type Release \
            --jobs 4 \
            --deploy-dir "$DEPLOY" \
            --source-tree "${{ github.workspace }}/build" \
            --define HE_PORTABLE_BUILD=ON \
            --define HE_PREFER_MBEDTLS=ON

      # The size guard for main, moved here from runtime-flavors.yml — that workflow
      # is now for feature branches only, and main would otherwise lose the watch on
      # all three runtimes at once. Game is weighed too: the editor build deployed it.
      #
      # Exit code 2 is the script's "nothing I may judge" — a platform or flavour with
      # no measured threshold yet. That stays green, or the first run on a new platform
      # goes red for the honest state it exists to establish.
      - name: Check the runtimes against the size thresholds
        if: github.event_name == 'push'
        shell: bash
        run: |
          PY=$(command -v python3 || command -v python)
          rc=0
          for pair in "Game:game" "AppAdvanced:app-advanced" "AppBasic:app-basic"; do
            dir="${pair%%:*}"; flavor="${pair##*:}"
            echo "── $flavor ──────────────────────────────────────────────"
            set +e
            "$PY" scripts/runtime_size.py "$DEPLOY_ROOT/$dir" \
              --check --flavor="$flavor" --build-type=Release
            code=$?
            set -e
            if [ "$code" = "2" ]; then
              echo "(no measured threshold yet — skipped)"
            elif [ "$code" != "0" ]; then
              rc=1
            fi
          done
          exit $rc

      # Windows and Linux ship package/Editor as a whole, so the runtimes have to move
      # INTO it — the same place the editor's own POST_BUILD puts Editor/Game, and the
      # only place findRuntimeBundle() looks once the editor is unzipped somewhere else
      # entirely. macOS does the equivalent inside package_macos.sh, where the target is
      # HorizonEditor.app/Contents/Resources.
      #
      # The .log and .ini are dev-time run droppings the deploy can accumulate; Game
      # gets the same treatment in package_macos.sh.
      - name: Stage the app runtimes into the editor package
        if: github.event_name == 'push' && runner.os != 'macOS'
        shell: bash
        run: |
          for name in AppAdvanced AppBasic; do
            if [ -d "$DEPLOY_ROOT/$name" ]; then
              rm -rf "$DEPLOY_ROOT/Editor/$name"
              mv "$DEPLOY_ROOT/$name" "$DEPLOY_ROOT/Editor/$name"
              rm -f "$DEPLOY_ROOT/Editor/$name/HorizonEngine.log" \
                    "$DEPLOY_ROOT/Editor/$name/imgui.ini"
              echo "staged $name"
            else
              echo "::error::$DEPLOY_ROOT/$name missing — the flavour build did not deploy it"
              exit 1
            fi
          done

      # The editor POST_BUILD deployed a self-contained bundle into package/Editor:
      # HorizonEditor.exe + engine DLLs + SDL3 + EngineContent/Fonts/Images + Vulkan
      # Shaders + the bundled cmake + the CPython runtime (python3XY.dll/.zip/._pth),
      # plus the Game runtime and — on a push — the two app runtimes staged above.
      # Zip it and upload as a downloadable artifact (the "Artifacts" box on the run).
      #
      # Moved below the tests so all three platforms package in the same place in the
      # run. It used to sit before them, which meant Windows uploaded an editor even
      # when ctest was red; it now behaves like macOS and Linux always have.
      - name: Package Windows editor
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path "package/Editor/*" -DestinationPath "HorizonEditor-windows-x64.zip" -Force

      - name: Upload Windows editor package
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: HorizonEditor-windows-x64
          path: HorizonEditor-windows-x64.zip
          if-no-files-found: error

      # ── macOS: build the self-contained .app + DMG installer ────────────────────
      # The `dmg` custom target runs scripts/package_macos.sh, which stages
      # out/deploy/Editor into HorizonEditor.app (engine dylibs BFS-bundled + rpaths
      # rewritten), ad-hoc code-signs it (no Developer ID / secrets — cert-free), and
      # produces out/HorizonEditor-<version>.dmg. Runs after the tests so a packaging
      # failure surfaces without masking the build+test result.
      - name: Package macOS editor (DMG)
        if: runner.os == 'macOS'
        run: cmake --build build --target dmg

      - name: Upload macOS editor package
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: HorizonEditor-macos-arm64
          path: out/HorizonEditor-*.dmg
          if-no-files-found: error

      # ── Linux: tarball the self-contained editor bundle ─────────────────────────
      # The editor POST_BUILD deployed package/Editor: HorizonEditor + engine .so
      # (found next to it via the $ORIGIN rpath) + SDL3 + EngineContent/Fonts/Images +
      # bundled cmake + libpython + the Game runtime. tar (not zip) preserves the
      # executable bit on the binaries.
      - name: Package Linux editor
        if: runner.os == 'Linux'
        run: tar czf HorizonEditor-linux-x64.tar.gz -C package Editor

      - name: Upload Linux editor package
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: HorizonEditor-linux-x64
          path: HorizonEditor-linux-x64.tar.gz
          if-no-files-found: error
